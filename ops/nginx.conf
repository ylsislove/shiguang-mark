# Install after issuing the certificate with ops/nginx.bootstrap.conf.
server {
    listen 80;
    server_name mark.aayu.today;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mark.aayu.today/acme;
        try_files $uri =404;
    }
    location / { return 301 https://mark.aayu.today$request_uri; }
}

# Install as a separate virtual host; do not replace shared nginx.conf.
server {
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/mark.aayu.today/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mark.aayu.today/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MarkTLS:10m;
    ssl_session_timeout 1d;
    server_name mark.aayu.today;
    root /var/www/mark.aayu.today/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src https://photon.komoot.io; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location = /index.html { expires -1; }
    location ~* \.(js|css|svg)$ { expires 7d; }
    location ~ /\. { deny all; }
}
