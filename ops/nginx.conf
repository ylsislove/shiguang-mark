# Install as a separate virtual host; do not replace shared nginx.conf.
server {
    listen 80;
    server_name mark.aayu.today;
    root /var/www/mark.aayu.today/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
    location / { try_files $uri $uri/ =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|svg)$ { expires 7d; }
    location ~ /\. { deny all; }
}
